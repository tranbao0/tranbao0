<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Activity</title>
<link rel="stylesheet" href="zine.css">
<style>
  #page { padding: 150px 0 40px; }
  #sheet { position: relative; margin: 0 56px; padding: 40px 48px 54px; transform: rotate(-0.6deg); }

  #top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  #head { position: relative; width: fit-content; height: 124px; margin: 0 0 6px -22px; padding: 0 40px; display: flex; align-items: center;
          font-family: "Anton", sans-serif; font-size: 98px; line-height: 1; color: #fff; letter-spacing: 3px; transform: rotate(0.5deg); white-space: nowrap; }
  #top .line { font-size: 64px; line-height: 1; margin-left: 4px; transform: rotate(-0.6deg); }
  #copy { position: relative; padding: 12px 22px 6px; text-align: center; font-family: "Rubik Mono One", sans-serif; font-size: 56px; line-height: 1.2;
          transform: rotate(3deg); margin: 0 6px 0 0; }
  #copy small { display: block; font-size: 56px; }

  #graph { position: relative; }
  #graph svg { display: block; overflow: visible; }
  .month { position: absolute; top: 0; font-family: "Anton", sans-serif; font-size: 56px; line-height: 1; }
  #legend { display: flex; align-items: center; justify-content: flex-end; gap: 18px; margin: 0 4px 6px 0; font-size: 60px; line-height: 1.1; transform: rotate(-0.4deg); }
  #legend svg { overflow: visible; }

  #mid { margin-bottom: 10px; }
  #langhead { position: relative; width: fit-content; height: 112px; margin-left: -22px; padding: 0 46px; display: flex; align-items: center;
              font-family: "Anton", sans-serif; font-size: 88px; line-height: 1; color: #fff; letter-spacing: 3px; transform: rotate(-0.8deg); }
  .lang { display: flex; align-items: center; height: 72px; margin-bottom: 4px; }
  .lang .name { flex: none; width: var(--name-width, 380px); font-size: var(--name-size, 62px); white-space: nowrap; line-height: 1; padding-left: 8px; }
  .lang .room { position: relative; flex: 1; height: 72px; }
  .lang .bar { position: absolute; left: 0; top: 2px; height: 68px; }
  .lang .pct { position: absolute; top: 4px; font-family: "Permanent Marker", cursive; font-size: 68px; line-height: 1; white-space: nowrap; }

  .tape-piece { position: absolute; width: 250px; height: 84px; }
</style>
</head>
<body>
<div id="page">
  <div class="track" id="track">TRACK 05 - Activity</div>

  <div id="sheet">
    <div id="top">
      <div><div id="head"></div><div class="line">in the last year</div></div>
      <div id="copy" class="stamp double"></div>
    </div>

    <div id="graph"></div>

    <div id="legend"></div>

    <div id="mid"><div id="langhead">TOP LANGUAGES</div></div>
    <div id="langs"></div>
  </div>

  <div class="tape-piece" id="tapeA" style="left:1330px;top:84px;transform:rotate(38deg)"></div>
  <div class="tape-piece" id="tapeB" style="left:-60px;top:1100px;transform:rotate(36deg)"></div>
</div>
<script src="parts.js"></script>
<script>
  const SVG = 'http://www.w3.org/2000/svg';

  function svgEl(name, attrs = {}) {
    const el = document.createElementNS(SVG, name);
    for (const [key, value] of Object.entries(attrs)) el.setAttribute(key, value);
    return el;
  }

  // Rough ink blot of a given diameter: a ring of slightly uneven radii, like a rubber stamp pressed on paper.
  function blot(rand, cx, cy, diameter) {
    const n = 11;
    const points = [];
    for (let k = 0; k < n; k++) {
      const a = (k / n) * Math.PI * 2 + rand() * 0.25;
      const r = (diameter / 2) * (0.86 + rand() * 0.28);
      points.push(`${(cx + Math.cos(a) * r).toFixed(1)},${(cy + Math.sin(a) * r).toFixed(1)}`);
    }
    return svgEl('polygon', { points: points.join(' '), fill: '#000' });
  }

  // Blot diameters for the five GitHub levels: NONE to FOURTH_QUARTILE.
  const SIZES = [5, 13, 18, 22, 26];
  // The legend shows the lightest level larger, so its first dot stays visible on a phone.
  const LEGEND_SIZES = [11, 14, 18, 22, 26];

  function drawGraph(host, data, width) {
    const cols = data.weeks.length;
    const pitchX = Math.floor(width / cols);
    const pitchY = 30;
    const top = 64;
    const rand = zine.rng(77);
    const svg = svgEl('svg', { width, height: top + 7 * pitchY });
    data.weeks.forEach((week, col) => {
      for (const day of week) {
        const cx = col * pitchX + pitchX / 2 + (rand() - 0.5) * 2;
        const cy = top + day.weekday * pitchY + pitchY / 2 + (rand() - 0.5) * 2;
        svg.appendChild(blot(rand, cx, cy, SIZES[day.level]));
      }
    });
    host.style.height = `${top + 7 * pitchY}px`;
    host.appendChild(svg);
    for (const m of data.months) {
      const el = document.createElement('div');
      el.className = 'month';
      el.textContent = m.label;
      el.style.left = `${m.col * pitchX}px`;
      host.appendChild(el);
    }
  }

  function drawLegend(host) {
    const rand = zine.rng(78);
    const word = (text) => Object.assign(document.createElement('span'), { textContent: text });
    host.appendChild(word('less'));
    for (const size of LEGEND_SIZES) {
      const svg = svgEl('svg', { width: 30, height: 30 });
      svg.appendChild(blot(rand, 15, 15, size));
      host.appendChild(svg);
    }
    host.appendChild(word('more'));
  }

  // One row for each language. A bar is as long as the rounded percent that the row shows, so equal numbers give equal bars.
  function drawLanguages(host, languages) {
    const rows = languages.map((lang, i) => {
      const row = document.createElement('div');
      row.className = 'lang';
      row.style.transform = `rotate(${[-0.5, 0.4, -0.3, 0.6, -0.4][i % 5]}deg)`;
      const name = Object.assign(document.createElement('div'), { className: 'name', textContent: lang.name });
      const room = document.createElement('div');
      room.className = 'room';
      const bar = document.createElement('div');
      bar.className = 'bar';
      const pct = Object.assign(document.createElement('div'), { className: 'pct', textContent: `${lang.percent}%` });
      room.append(bar, pct);
      row.append(name, room);
      host.appendChild(row);
      return { lang, name, bar, pct };
    });
    // The label column fits the longest name, and the type shrinks a little if a name is very long.
    let size = 62;
    const widest = () => Math.max(...rows.map((r) => r.name.scrollWidth));
    host.style.setProperty('--name-size', `${size}px`);
    host.style.setProperty('--name-width', 'auto');
    while (widest() > 560 && size > 56) host.style.setProperty('--name-size', `${--size}px`);
    const nameWidth = Math.max(380, widest() + 24);
    host.style.setProperty('--name-width', `${nameWidth}px`);
    const room = host.clientWidth - nameWidth - 190;
    const max = Math.max(1, ...languages.map((l) => l.percent));
    for (const { lang, bar, pct } of rows) {
      const width = Math.max(24, Math.round((lang.percent / max) * room));
      bar.style.width = `${width}px`;
      pct.style.left = `${width + 22}px`;
    }
    return rows.map((r) => r.bar);
  }

  // Shrinks the type of the black total bar until the bar and the date stamp fit on one row.
  function fitTotal(head, stamp, row, base) {
    let size = base;
    head.style.fontSize = `${size}px`;
    while (head.offsetWidth + stamp.offsetWidth + 20 > row.clientWidth && size > 60) head.style.fontSize = `${--size}px`;
  }

  zine.ready(['Anton', 'Special Elite', 'Permanent Marker', 'Rubik Mono One'], () => {
    const $ = (id) => document.getElementById(id);
    const data = window.PAGE_DATA;
    $('head').textContent = `${data.total} ${data.total === 1 ? 'CONTRIBUTION' : 'CONTRIBUTIONS'}`;
    $('copy').append('COPY DATE', Object.assign(document.createElement('small'), { textContent: data.copyDate }));
    fitTotal($('head'), $('copy'), $('top'), 98);
    const sheet = $('sheet');
    const graphWidth = sheet.clientWidth - 96;
    drawGraph($('graph'), data, graphWidth);
    drawLegend($('legend'));
    const bars = drawLanguages($('langs'), data.languages);

    zine.paper(sheet, { seed: 51, sides: { top: 'cut', right: 'cut', bottom: 'torn', left: 'cut' } });
    zine.paper($('head'), { seed: 52, fill: '#000', rim: '#000', sides: { left: 'torn', right: 'torn', top: 'cut', bottom: 'cut' } });
    zine.paper($('langhead'), { seed: 53, fill: '#000', rim: '#000', sides: { left: 'torn', right: 'torn', top: 'cut', bottom: 'cut' } });
    bars.forEach((bar, i) => zine.paper(bar, { seed: 60 + i, fill: '#000', rim: '#000', sides: { left: 'torn', right: 'torn', top: 'cut', bottom: 'cut' } }));
    zine.wear($('copy'), { seed: 54, patches: 10, scratches: 4, size: 2 });
    zine.track($('track'), { seed: 5 });
    zine.tape($('tapeA'), { seed: 6 });
    zine.tape($('tapeB'), { seed: 7 });

    $('tapeB').style.top = `${$('page').offsetHeight - 90}px`;
  });
</script>
</body>
</html>
