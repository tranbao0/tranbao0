<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Title Track</title>
<link rel="stylesheet" href="../node_modules/@tranbao0/printshop/packs/zine/zine.css">
<link rel="stylesheet" href="compact.css">
<style>
  #page { height: 175px; }
  #heading { position: absolute; left: 0; top: 0; width: 1600px; height: 175px; }
  #slip { position: absolute; left: 30px; top: 106px; padding: 8px 30px 4px 100px; font-size: 40px; line-height: 1.15; white-space: nowrap; transform: rotate(-1.2deg); -webkit-text-stroke: 1px #000; }
  .tape-piece { position: absolute; width: 130px; height: 52px; }
</style>
</head>
<body>
<div id="page">
  <div class="base-layer">
    <div class="track" id="track">TRACK 04 - Title Track</div>
    <div id="slip">Title track: Weekrow</div>
    <div class="tape-piece" id="tapeA" style="left:-4px;top:122px;transform:rotate(-38deg)"></div>
  </div>
  <div class="title-layer" id="heading"></div>
</div>
<script src="../node_modules/@tranbao0/printshop/packs/zine/parts.js"></script>
<script>
  zine.ready(['Anton', 'Archivo Black', 'Alfa Slab One', 'Special Elite', 'Rubik Mono One'], () => {
    const $ = (id) => document.getElementById(id);
    zine.track($('track'), { seed: 5 });
    zine.paper($('slip'), { seed: 481, sides: { top: 'cut', right: 'torn', bottom: 'cut', left: 'torn' } });
    zine.tape($('tapeA'), { seed: 482 });

    // Cut-out letters laid out left to right on one baseline, like the cover title. `dy` nudges a tile off the baseline.
    // ?letter=N keeps only tile N. The layout always runs over every tile, so a single tile sits exactly where it sits in the whole word.
    const letters = [
      { text: 'P', font: 'Alfa Slab One', heightInk: 90, fill: '#fff', color: '#000', rot: -2.5, dy: 0, gap: 10 },
      { text: 'R', font: 'Anton', heightInk: 96, fill: '#000', color: '#fff', rot: 2, dy: -2, gap: 4 },
      { text: 'O', font: 'Rubik Mono One', heightInk: 88, fill: '#8f8f8f', color: '#000', rot: -1.5, dy: 6, gap: 8 },
      { text: 'J', font: 'Archivo Black', heightInk: 96, fill: '#fff', color: '#000', rot: 3, dy: 2, gap: 4 },
      { text: 'E', font: 'Anton', heightInk: 96, fill: '#fff', color: '#000', rot: -2, dy: 0, gap: 10 },
      { text: 'C', font: 'Alfa Slab One', heightInk: 90, fill: '#000', color: '#fff', rot: 2.5, dy: 5, gap: 4 },
      { text: 'T', font: 'Archivo Black', heightInk: 96, fill: '#8f8f8f', color: '#000', rot: -3, dy: 2, gap: 8 },
      { text: 'S', font: 'Anton', heightInk: 94, fill: '#fff', color: '#000', rot: 1.5, dy: 3, gap: 0 },
    ];
    const baseline = 136;
    const padX = 20;
    const padY = 12;
    const query = new URLSearchParams(location.search);
    const only = query.has('letter') ? Number(query.get('letter')) : null;
    const tiles = [];
    let x = 0;
    letters.forEach((l, i) => {
      const el = zine.tile($('heading'), { ...l, padX, padY, x, y: 0, seed: 490 + i });
      el.style.top = `${baseline + l.dy - (el.offsetHeight - padY)}px`;
      tiles.push(el);
      x += el.offsetWidth + l.gap;
    });
    // Right-align the letters with the 28px page margin.
    const shift = 1600 - 40 - x;
    tiles.forEach((el) => { el.style.left = `${parseFloat(el.style.left) + shift}px`; });
    if (only !== null) tiles.forEach((el, i) => { if (i !== only) el.remove(); });
    document.body.dataset.headingStart = String(Math.round(shift));
  });
</script>
</body>
</html>
