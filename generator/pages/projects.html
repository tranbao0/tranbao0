<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Title Track</title>
<link rel="stylesheet" href="zine.css">
<style>
  #page { height: 378px; }
  #heading { position: absolute; left: 0; top: 0; width: 1600px; height: 378px; }
  .tape-piece { position: absolute; width: 190px; height: 70px; }
</style>
</head>
<body>
<div id="page">
  <div class="track" id="track">TRACK 04 - Title Track</div>
  <div id="heading"></div>
  <div class="tape-piece" id="tapeA" style="left:1360px;top:184px;transform:rotate(38deg)"></div>
</div>
<script src="parts.js"></script>
<script>
  zine.ready(['Anton', 'Archivo Black', 'Alfa Slab One', 'Special Elite', 'Rubik Mono One'], () => {
    const $ = (id) => document.getElementById(id);
    zine.track($('track'), { seed: 5 });
    zine.tape($('tapeA'), { seed: 482 });

    // Cut-out letters laid out left to right on one baseline, like the cover title. `dy` nudges a tile off the baseline.
    const letters = [
      { text: 'P', font: 'Alfa Slab One', heightInk: 132, fill: '#fff', color: '#000', rot: -2.5, dy: 0, gap: 14 },
      { text: 'R', font: 'Anton', heightInk: 144, fill: '#000', color: '#fff', rot: 2, dy: -6, gap: 6 },
      { text: 'O', font: 'Rubik Mono One', heightInk: 128, fill: '#8f8f8f', color: '#000', rot: -1.5, dy: 8, gap: 10 },
      { text: 'J', font: 'Archivo Black', heightInk: 140, fill: '#fff', color: '#000', rot: 3, dy: 2, gap: 4 },
      { text: 'E', font: 'Anton', heightInk: 146, fill: '#fff', color: '#000', rot: -2, dy: -4, gap: 12 },
      { text: 'C', font: 'Alfa Slab One', heightInk: 130, fill: '#000', color: '#fff', rot: 2.5, dy: 6, gap: 6 },
      { text: 'T', font: 'Archivo Black', heightInk: 146, fill: '#8f8f8f', color: '#000', rot: -3, dy: -2, gap: 10 },
      { text: 'S', font: 'Anton', heightInk: 140, fill: '#fff', color: '#000', rot: 1.5, dy: 4, gap: 0 },
    ];
    const baseline = 338;
    const padX = 26;
    const padY = 14;
    let x = 72;
    letters.forEach((l, i) => {
      const el = zine.tile($('heading'), { ...l, padX, padY, x, y: 0, seed: 490 + i });
      el.style.top = `${baseline + l.dy - (el.offsetHeight - padY)}px`;
      x += el.offsetWidth + l.gap;
    });
    document.body.dataset.headingEnd = String(Math.round(x));
  });
</script>
</body>
</html>
