<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Outro</title>
<link rel="stylesheet" href="zine.css">
<style>
  #page { padding: 192px 64px 44px; }

  .big { position: relative; font-family: "Anton", sans-serif; color: #fff; text-transform: uppercase; line-height: 0.95; white-space: nowrap; }
  #big { font-size: 170px; letter-spacing: 3px; transform: rotate(-1.2deg); transform-origin: 0 50%; margin-left: 6px; }

  #note { position: relative; width: 1240px; margin: 36px 0 0 150px; padding: 34px 56px 30px; font-size: 62px; line-height: 1.2; -webkit-text-stroke: 1.2px #000; transform: rotate(0.9deg); }

  .lower { display: flex; gap: 52px; align-items: flex-start; margin-top: 40px; }
  #list { position: relative; flex: none; width: 1060px; padding: 40px 50px 40px; transform: rotate(-1.3deg); }
  #list h2 { font-family: "Anton", sans-serif; font-weight: 400; font-size: 78px; letter-spacing: 5px; line-height: 1; margin-bottom: 8px; }
  .row { display: flex; align-items: baseline; gap: 26px; padding: 2px 0 4px; border-bottom: 4px dashed #444; font-size: 56px; line-height: 1.1; white-space: nowrap; }
  .row:last-child { border-bottom: 0; }
  .row b { font-family: "Archivo Black", sans-serif; font-weight: 400; font-size: 58px; width: 86px; flex: none; }

  .side { position: relative; flex: 1; min-width: 0; align-self: stretch; }
  #bar { position: absolute; left: 0; top: 0; width: 100%; bottom: 236px; padding: 30px 34px; transform: rotate(2.2deg); }
  #bar .bars { display: flex; align-items: stretch; justify-content: space-between; height: 100%; }
  #bar .bars i { display: block; background: #000; }
  #copy { position: absolute; left: 10px; bottom: 0; font-family: "Archivo Black", sans-serif; font-size: 64px; line-height: 1.12; text-align: center; color: #fff; padding: 18px 26px 12px; border: 9px solid #fff; border-radius: 10px; transform: rotate(-4deg); white-space: nowrap; }

  .tape-piece { position: absolute; width: 250px; height: 84px; }
</style>
</head>
<body>
<div id="page">
  <div class="track" id="track">TRACK 06 - Outro: Thanks to Neverland</div>

  <div class="big" id="big">Thanks to Neverland</div>

  <div id="note">and to everyone who read this far. See you at the next comeback.</div>

  <div class="lower">
    <div id="list">
      <h2>TRACKLIST</h2>
      <div class="row"><b>01</b><span>We code (Intro)</span></div>
      <div class="row"><b>02</b><span>Member Profile</span></div>
      <div class="row"><b>03</b><span>Credits</span></div>
      <div class="row"><b>04</b><span>Title Track</span></div>
      <div class="row"><b>05</b><span>Activity</span></div>
      <div class="row"><b>06</b><span>Outro: Thanks to Neverland</span></div>
    </div>
    <div class="side">
      <div id="bar"><div class="bars" id="bars"></div></div>
      <div id="copy">&copy; 2026<br>Bao Tran</div>
    </div>
  </div>

  <div class="tape-piece" id="tapeA" style="left:1290px;top:700px;transform:rotate(36deg)"></div>
  <div class="tape-piece" id="tapeB" style="left:70px;top:1100px;transform:rotate(-34deg)"></div>
  <div class="tape-piece" id="tapeC" style="left:0;top:0;transform:rotate(-7deg)"></div>
</div>
<script src="parts.js"></script>
<script>
  zine.ready(['Anton', 'Archivo Black', 'Special Elite'], () => {
    const $ = (id) => document.getElementById(id);
    const rand = zine.rng(66);
    const bars = $('bars');
    const room = bars.clientWidth;
    let used = 0;
    while (used < room - 30) {
      const w = [6, 6, 12, 18, 22][Math.floor(rand() * 5)];
      const gap = [8, 12, 16][Math.floor(rand() * 3)];
      if (used + w > room) break;
      bars.insertAdjacentHTML('beforeend', `<i style="width:${w}px"></i><i style="width:${gap}px;background:transparent"></i>`);
      used += w + gap;
    }
    zine.paper($('note'), { seed: 61, sides: { top: 'cut', right: 'torn', bottom: 'cut', left: 'torn' } });
    zine.paper($('list'), { seed: 62, sides: { top: 'torn', right: 'cut', bottom: 'torn', left: 'cut' } });
    zine.paper($('bar'), { seed: 63, sides: { top: 'cut', right: 'cut', bottom: 'cut', left: 'cut' } });
    zine.track($('track'), { seed: 5 });
    zine.tape($('tapeA'), { seed: 6 });
    zine.tape($('tapeB'), { seed: 7 });
    zine.wear($('copy'), { seed: 64, patches: 30, scratches: 3, size: 4 });
    const note = $('note');
    const list = $('list');
    $('tapeA').style.left = `${note.offsetLeft + note.offsetWidth - 140}px`;
    $('tapeA').style.top = `${note.offsetTop - 30}px`;
    $('tapeB').style.left = `${list.offsetLeft - 130}px`;
    $('tapeB').style.top = `${list.offsetParent.offsetTop + list.offsetTop + list.offsetHeight - 6}px`;
    const bar = $('bar');
    const tc = $('tapeC');
    zine.tape(tc, { seed: 8 });
    tc.style.left = `${bar.offsetParent.offsetLeft + bar.offsetLeft + 90}px`;
    tc.style.top = `${bar.offsetParent.offsetTop + bar.offsetTop - 40}px`;
  });
</script>
</body>
</html>
