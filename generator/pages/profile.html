<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Member Profile</title>
<link rel="stylesheet" href="zine.css">
<style>
  #page { padding: 168px 0 96px; }
  #sheet { position: relative; margin: 0 92px; padding: 74px 76px 120px; background: transparent; transform: rotate(-0.9deg); }

  #head { position: relative; width: fit-content; height: 176px; margin: 0 0 46px -26px; padding: 0 56px; display: flex; align-items: center;
          font-family: "Anton", sans-serif; font-size: 148px; line-height: 1; color: #fff; letter-spacing: 3px; transform: rotate(0.7deg); }

  .top { display: flex; gap: 56px; align-items: flex-start; }
  #photo { position: relative; flex: none; width: 480px; height: 600px; transform: rotate(-2.4deg); color: #fff; }
  #photo .name { position: absolute; left: 0; right: 0; top: 90px; text-align: center; font-family: "Anton", sans-serif; font-size: 270px; line-height: 1; letter-spacing: 4px; }
  #photo .frame { position: absolute; inset: 22px; overflow: visible; }
  #maknae { position: absolute; left: 30px; bottom: 76px; white-space: nowrap; font-family: "Anton", sans-serif; font-size: 104px; line-height: 1; letter-spacing: 6px;
            padding: 6px 22px 0; border: 9px solid #fff; border-radius: 8px; transform: rotate(-9deg); }

  .col { flex: 1; min-width: 0; padding-top: 6px; }
  .field { position: relative; border-bottom: 4px dashed #444; padding: 2px 0 10px; margin-bottom: 20px; }
  .label { display: block; font-size: 56px; line-height: 1.15; }
  .value { display: block; font-family: "Permanent Marker", cursive; font-size: 66px; line-height: 1.1; transform: rotate(var(--r, 0deg)); transform-origin: 0 60%; padding-top: 4px; }

  .role { white-space: nowrap; }

  .fold { position: absolute; left: -10px; right: -10px; height: 26px; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.32) 55%, rgba(0,0,0,.5) 58%, rgba(0,0,0,0)); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 60px; margin-top: 36px; }
  .grid .wide { grid-column: 1 / -1; }
  .inline { display: flex; align-items: baseline; gap: 26px; flex-wrap: wrap; }
  .inline .label { display: inline; }
  .inline .value { display: inline; }

  .tape-piece { position: absolute; width: 250px; height: 84px; }
  .scribble { position: absolute; overflow: visible; pointer-events: none; }
</style>
</head>
<body>
<div id="page">
  <div class="track" id="track">TRACK 02 - Member Profile</div>

  <div id="sheet">
    <div id="head">MEMBER PROFILE</div>

    <div class="top">
      <div id="photo">
        <svg class="frame" id="frameLines" width="436" height="556" viewBox="0 0 436 556" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 10 L 424 4 L 430 540 L 12 548 Z"/>
          <path d="M22 28 L 408 22 L 414 522 L 28 530 Z" stroke-width="4"/>
        </svg>
        <div class="name">BAO</div>
        <div id="maknae">MAKNAE</div>
      </div>
      <div class="col">
        <div class="field"><span class="label">Stage name:</span><span class="value" style="--r:-1.2deg">Bao</span></div>
        <div class="field"><span class="label">Real name:</span><span class="value" style="--r:0.8deg">Bao Tran</span></div>
        <div class="field"><span class="label">Position:</span><span class="value" style="--r:-0.6deg"><span class="role">Maknae,</span><br><span class="role">Main Backend,</span><br><span class="role">Lead Debugger,</span><br><span class="role">Sub Frontend</span></span></div>
      </div>
    </div>

    <div class="grid">
      <div class="field"><span class="label">Based in:</span><span class="value" style="--r:0.7deg">San Jose, CA</span></div>
      <div class="field"><span class="label">Debut:</span><span class="value" style="--r:-0.9deg">2019</span></div>
      <div class="field"><span class="label">MBTI:</span><span class="value" style="--r:-0.5deg">ENTP</span></div>
      <div class="field"><span class="label">Bias:</span><span class="value" style="--r:1deg">Soyeon</span>
        <svg class="scribble" style="left:-34px;top:62px" width="360" height="110" viewBox="0 0 360 110" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M60 14 C 150 -2, 300 8, 332 50 C 350 92, 200 106, 100 98 C 20 90, -6 46, 40 22 C 80 4, 200 -4, 290 12"/></svg></div>
      <div class="field wide"><div class="inline"><span class="label">Favorite i-dle song:</span><span class="value" style="--r:-1deg">"Mono"</span>
        <svg width="100" height="92" viewBox="0 0 100 92" fill="none" stroke="#000" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(10deg)"><path d="M50 84 C 20 60, 4 44, 8 26 C 12 6, 40 6, 50 28 C 60 4, 92 8, 92 30 C 92 48, 70 64, 48 86"/></svg></div></div>
      <div class="field wide"><span class="label">Fun fact:</span><span class="value" style="--r:0.5deg">My vocal range is G2 to C6.</span></div>
    </div>
  </div>

  <div class="tape-piece" id="tapeA" style="left:1250px;top:120px;transform:rotate(38deg)"></div>
  <div class="tape-piece" id="tapeB" style="left:18px;top:1930px;transform:rotate(36deg)"></div>
</div>
<script src="parts.js"></script>
<script>
  zine.ready(['Anton', 'Special Elite', 'Permanent Marker'], () => {
    const $ = (id) => document.getElementById(id);
    const sheet = $('sheet');
    zine.paper(sheet, { seed: 41, sides: { top: 'cut', right: 'cut', bottom: 'torn', left: 'cut' } });
    zine.paper($('head'), { seed: 42, fill: '#000', rim: '#000', sides: { left: 'torn', right: 'torn', top: 'cut', bottom: 'cut' } });
    zine.paper($('photo'), { seed: 43, fill: '#000', rim: '#000', sides: { top: 'torn', right: 'cut', bottom: 'torn', left: 'cut' } });
    zine.track($('track'), { seed: 5 });
    zine.tape($('tapeA'), { seed: 6 });
    zine.tape($('tapeB'), { seed: 7 });
    zine.wear($('maknae'), { seed: 44, patches: 60, size: 4 });
    const fold = document.createElement('div');
    fold.className = 'fold';
    const top = sheet.querySelector('.top');
    fold.style.top = `${top.offsetTop + top.offsetHeight + 18 - 13}px`;
    sheet.appendChild(fold);
  });
</script>
</body>
</html>
