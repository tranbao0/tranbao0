name: Update activity page

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity-page
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: generator/package-lock.json

      - name: Install packages
        working-directory: generator
        run: npm ci

      - name: Install the Chromium headless shell
        working-directory: generator
        run: npx playwright install --with-deps --only-shell chromium

      - name: Build the activity page
        working-directory: generator
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node build.mjs activity

      - name: Commit the page if it changed
        run: |
          git add assets/activity.png
          if git diff --cached --quiet; then
            echo "The activity page did not change."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update activity page"
          git pull --rebase origin main
          git push origin HEAD:main
