name: Update activity page

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: activity-page
  cancel-in-progress: false

jobs:
  build:
    name: Build the activity page
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: generator/package-lock.json

      - name: Install packages
        working-directory: generator
        run: npm ci --ignore-scripts

      - name: Install the Chromium headless shell
        working-directory: generator
        run: npx playwright install --with-deps --only-shell chromium

      - name: Build the activity page
        working-directory: generator
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node build.mjs activity

      - name: Collect the page and its alt text
        run: |
          mkdir staging
          cp assets/activity.png staging/activity.png
          cp generator/.cache/activity-alt.txt staging/activity-alt.txt

      - name: Upload the page and its alt text
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: activity-page
          path: |
            staging/activity.png
            staging/activity-alt.txt
          if-no-files-found: error
          retention-days: 3

  commit:
    name: Commit the activity page
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the page and its alt text
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: activity-page
          path: ${{ runner.temp }}/activity-page

      - name: Put the page and its alt text in the repository
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/activity-page
        run: |
          python3 -I - <<'PY'
          import os, re, struct, sys, zlib
          from pathlib import Path

          def check_png(data):
              if not data.startswith(b"\x89PNG\r\n\x1a\n") or len(data) > 350 * 1024:
                  return "not a PNG of at most 350 KB"
              pos, first = 8, True
              while pos + 12 <= len(data):
                  length, kind = struct.unpack(">I4s", data[pos:pos + 8])
                  body = data[pos + 8:pos + 8 + length]
                  crc = data[pos + 8 + length:pos + 12 + length]
                  if len(body) != length or len(crc) != 4:
                      return "a chunk is cut short"
                  if struct.unpack(">I", crc)[0] != zlib.crc32(kind + body):
                      return "a chunk has a bad CRC"
                  if first:
                      if kind != b"IHDR" or length != 13:
                          return "the first chunk is not IHDR"
                      width, height, _, color_type = struct.unpack(">IIBB", body[:10])
                      if width != 1600 or height != 750 or color_type != 3:
                          return "unexpected size or color type"
                      first = False
                  pos += 12 + length
                  if kind == b"IEND":
                      return None if pos == len(data) else "bytes after IEND"
              return "no IEND chunk"

          artifact = Path(os.environ["ARTIFACT_DIR"])
          png = (artifact / "activity.png").read_bytes()
          problem = check_png(png)
          if problem:
              sys.exit("activity.png is not valid: " + problem)

          alt = (artifact / "activity-alt.txt").read_text(encoding="utf-8").strip()
          language = r"[A-Za-z0-9 +#.-]{1,40} \d{1,3}%"
          outro = (
              r"Track 06, Outro: Thanks to Neverland\. And to everyone who read this far\. See you at the next comeback\. "
              r"Tracklist: 01 We code Intro, 02 Member Profile, 03 Credits, 04 Title Track, 05 Activity, 06 Outro: Thanks to Neverland\. "
              r"Copyright 2026 Bao Tran\."
          )
          template = (
              r"Track 05, Activity\. \d{1,7} contributions? in the last year\. "
              r"Top languages: " + language + r"(, " + language + r"){0,4}\. "
              r"Copied \d{4}-\d{2}-\d{2}\. " + outro
          )
          if len(alt) > 800 or not re.fullmatch(template, alt, re.ASCII):
              sys.exit("The alt text does not match the expected form")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          pattern = re.compile(r'(<img src="assets/activity\.png" alt=")[^"]*(")')
          text, count = pattern.subn(lambda m: m.group(1) + alt + m.group(2), text)
          if count != 1:
              sys.exit("Expected exactly one activity image in README.md, found %d" % count)

          Path("assets/activity.png").write_bytes(png)
          readme.write_text(text, encoding="utf-8")
          PY

      - name: Commit and push if something changed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.png README.md
          if git diff --cached --quiet; then
            echo "The activity page did not change."
            exit 0
          fi
          git commit -m "Update activity page"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || { echo "main no longer contains $GITHUB_SHA"; exit 1; }
          git rebase --onto FETCH_HEAD HEAD~1
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
