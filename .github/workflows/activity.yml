name: Update activity page

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: activity-page
  cancel-in-progress: false

jobs:
  build:
    name: Build the activity page
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: generator/package-lock.json

      - name: Install packages
        working-directory: generator
        run: npm ci --ignore-scripts

      - name: Install the Chromium headless shell
        working-directory: generator
        run: npx playwright install --with-deps --only-shell chromium

      - name: Build the activity page
        working-directory: generator
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node build.mjs activity

      - name: Collect the page and its alt text
        run: |
          mkdir staging
          cp assets/activity.png staging/activity.png
          cp generator/.cache/activity-alt.txt staging/activity-alt.txt

      - name: Upload the page and its alt text
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: activity-page
          path: |
            staging/activity.png
            staging/activity-alt.txt
          if-no-files-found: error
          retention-days: 3

  commit:
    name: Commit the activity page
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Download the page and its alt text
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: activity-page
          path: ${{ runner.temp }}/activity-page

      - name: Put the page and its alt text in the repository
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/activity-page
        run: |
          python3 - <<'PY'
          import os, re, sys
          from pathlib import Path

          artifact = Path(os.environ["ARTIFACT_DIR"])
          png = (artifact / "activity.png").read_bytes()
          if not png.startswith(b"\x89PNG\r\n\x1a\n") or len(png) > 350 * 1024:
              sys.exit("activity.png is not a PNG of at most 350 KB")

          alt = (artifact / "activity-alt.txt").read_text(encoding="utf-8").strip()
          if not re.fullmatch(r"[A-Za-z0-9 ,.%:+#-]{1,500}", alt):
              sys.exit("The alt text has characters that are not allowed")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          pattern = re.compile(r'(<img src="assets/activity\.png" alt=")[^"]*(")')
          text, count = pattern.subn(lambda m: m.group(1) + alt + m.group(2), text)
          if count != 1:
              sys.exit("Expected exactly one activity image in README.md, found %d" % count)

          Path("assets/activity.png").write_bytes(png)
          readme.write_text(text, encoding="utf-8")
          PY

      - name: Commit and push if something changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.png README.md
          if git diff --cached --quiet; then
            echo "The activity page did not change."
            exit 0
          fi
          git commit -m "Update activity page"
          git pull --rebase origin main
          git push origin HEAD:main
