<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="400" viewBox="0 0 1600 400">
<style>
@keyframes sweep { from { transform: translateX(-300px); } to { transform: translateX(1600px); } }
.bar { animation: sweep 2s linear infinite; }
@keyframes flick { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
.flick { animation: flick 1s steps(2) infinite; }
@media (prefers-reduced-motion: reduce) { .bar, .flick { animation: none; } }
</style>
<image width="1600" height="400" href="data:image/png;base64," xlink:href="data:image/png;base64," preserveAspectRatio="none"/>
<rect class="bar" x="0" y="0" width="300" height="400" fill="#ff0000" fill-opacity="0.8"/>
<rect class="flick" x="650" y="120" width="300" height="160" fill="#00ff00"/>
</svg>